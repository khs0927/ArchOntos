[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "archontos"
version = "0.1.0"
description = "OAIF - Open Architecture Intelligence Fabric for evidence-backed architecture regulation and design intelligence"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "Apache-2.0"}
authors = [{name = "ArchOntos"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "pgvector>=0.3.6,<1",
  "httpx>=0.28,<1",
  "minio>=7.2,<8",
  "prometheus-client>=0.21,<1",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
]

[project.optional-dependencies]
embeddings = [
  "fastembed>=0.8,<0.9",  # Apache-2.0, ONNX Runtime (no torch)
]
dev = [
  "pytest>=9.0.3,<10",  # PYSEC-2026-1845 (pip-audit, Phase 5)
  "pytest-asyncio>=1.3,<2",  # 1.3+ supports pytest 9
  "ruff>=0.9,<1",
  "mypy==1.20.2",  # pinned: mypy inference differs between releases
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["archontos"]

[tool.ruff.lint.per-file-ignores]
# The security rules are enabled for product code. In tests and in the offline
# contract harness they fire on the pytest idioms themselves rather than on
# anything an attacker could reach: assert, and a helper that builds a count
# query from a module constant.
"tests/**" = ["S101", "S105", "S106", "S107", "S603", "S608"]
"docs/**" = ["S101", "S603"]

[tool.mypy]
python_version = "3.12"
files = ["src", "apps"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Third-party packages without type information.
module = ["minio.*", "fastembed.*", "asyncpg.*", "pgvector.*"]
ignore_missing_imports = true
