services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_DB: archontos
      POSTGRES_USER: archontos
      POSTGRES_PASSWORD: archontos
    ports:
      # Loopback only: default credentials must not be reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - archontos-postgres:/var/lib/postgresql/data
      - ./db/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ./db/migrations/003_provenance_links.sql:/docker-entrypoint-initdb.d/003_provenance_links.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archontos -d archontos"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # Pinned: last official community image (the minio/minio image is no longer published).
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      # Same variables/defaults as the app settings (.env.example, archontos.config).
      MINIO_ROOT_USER: ${ARCHONTOS_MINIO_ACCESS_KEY:-archontos}
      MINIO_ROOT_PASSWORD: ${ARCHONTOS_MINIO_SECRET_KEY:-change-me}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - archontos-minio:/data

  rule-engine:
    build: .
    command: ["uvicorn", "apps.rule_engine:app", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      ARCHONTOS_DATABASE_URL: postgresql+asyncpg://archontos:archontos@postgres:5432/archontos
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy

  action:
    build: .
    command: ["uvicorn", "apps.action:app", "--host", "0.0.0.0", "--port", "8005"]
    environment:
      ARCHONTOS_DATABASE_URL: postgresql+asyncpg://archontos:archontos@postgres:5432/archontos
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  archontos-postgres:
  archontos-minio:
