{{- range $name, $svc := .Values.services }}
{{- $hpa := include "archontos.autoscaling" (dict "svc" $svc "root" $) | fromYaml }}
{{- if and $svc.enabled $hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: archontos-{{ $name }}
  labels:
    app.kubernetes.io/name: archontos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: archontos-{{ $name }}
  minReplicas: {{ $hpa.minReplicas }}
  maxReplicas: {{ $hpa.maxReplicas }}
  metrics:
    {{- if $hpa.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $hpa.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if $hpa.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $hpa.targetMemoryUtilizationPercentage }}
    {{- end }}
---
{{- end }}
{{- end }}
