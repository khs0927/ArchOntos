{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $hpa := include "archontos.autoscaling" (dict "svc" $svc "root" $) | fromYaml }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archontos-{{ $name }}
spec:
  {{- if not $hpa.enabled }}
  replicas: {{ default 1 $svc.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: archontos-{{ $name }}
  template:
    metadata:
      labels:
        app: archontos-{{ $name }}
        app.kubernetes.io/name: archontos
    spec:
      serviceAccountName: archontos
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["uvicorn", "{{ $svc.module }}", "--host", "0.0.0.0", "--port", "{{ $svc.port }}"]
          ports:
            - containerPort: {{ $svc.port }}
          resources:
            {{- toYaml (default $.Values.resources $svc.resources) | nindent 12 }}
          env:
          {{- range $key, $value := $.Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: archontos-{{ $name }}
spec:
  selector:
    app: archontos-{{ $name }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
---
{{- end }}
{{- end }}
